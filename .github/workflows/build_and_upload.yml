# .github/workflows/build_and_upload.yml

name: Build Signed App, Upload, and Create Release

# 触发器：当一个以 'v' 开头的 Git 标签被推送到仓库时触发
on:
  push:
    tags:
      - 'v*' # 匹配 v1.0, v1.2.3 等标签
  # 允许手动触发
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 虚拟机环境

    steps:
      # 步骤 1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤 2: 设置 Java 环境 (Flutter 打包 Android 需要)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # 步骤 3: 缓存 Flutter 依赖，加快后续构建速度
      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # 步骤 4: 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7' # 可以指定你项目使用的 Flutter 版本
          channel: 'stable'

      # 步骤 5: 获取 Flutter 依赖包
      - name: Get Flutter dependencies
        run: flutter pub get

      # 步骤 6: 解码并配置签名文件
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_JKS }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      # 步骤 7: 构建 Flutter APK 和 App Bundle
      - name: Build Flutter (APK & App Bundle)
        run: |
          flutter build apk --release
          flutter build appbundle --release

      # 步骤 8: 上传已签名的 APK 到 Google Drive (自包含脚本)
      - name: Upload APK to Google Drive
        run: |
          # 安装 jq 用于解析 JSON
          sudo apt-get install -y jq

          # --- 1. 从 Secrets 获取服务账号凭据并生成 JWT ---
          CLIENT_EMAIL=$(echo "${{ secrets.GDRIVE_CREDENTIALS_DATA }}" | jq -r .client_email)
          PRIVATE_KEY=$(echo "${{ secrets.GDRIVE_CREDENTIALS_DATA }}" | jq -r .private_key)
          
          HEADER_B64=$(echo -n '{"alg":"RS256","typ":"JWT"}' | base64 | tr '/+' '_-' | tr -d '=')
          
          IAT=$(date +%s)
          EXP=$(($IAT + 3500))
          SCOPE="https://www.googleapis.com/auth/drive"
          PAYLOAD="{\"iss\":\"$CLIENT_EMAIL\",\"scope\":\"$SCOPE\",\"aud\":\"https://oauth2.googleapis.com/token\",\"exp\":$EXP,\"iat\":$IAT}"
          PAYLOAD_B64=$(echo -n "$PAYLOAD" | base64 | tr '/+' '_-' | tr -d '=')
          
          SIGNATURE_INPUT="$HEADER_B64.$PAYLOAD_B64"
          SIGNATURE=$(echo -n "$SIGNATURE_INPUT" | openssl dgst -sha256 -sign <(echo -n "$PRIVATE_KEY") | base64 | tr '/+' '_-' | tr -d '=')
          
          JWT="$SIGNATURE_INPUT.$SIGNATURE"

          # --- 2. 用 JWT 换取 Access Token ---
          TOKEN_RESPONSE=$(curl -s -X POST "https://oauth2.googleapis.com/token" -H "Content-Type: application/x-www-form-urlencoded" -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=$JWT")
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r .access_token)

          # --- 3. 使用 Access Token 上传文件 ---
          FILE_PATH="build/app/outputs/flutter-apk/app-release.apk"
          FILE_NAME="app-release-${{ github.ref_name }}.apk"
          FOLDER_ID="${{ secrets.GDRIVE_FOLDER_ID }}"
          METADATA="{\"name\":\"$FILE_NAME\", \"parents\":[\"$FOLDER_ID\"]}"
          
          curl -s -X POST "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -F "metadata=$METADATA;type=application/json;charset=UTF-8" \
          -F "file=@$FILE_PATH;type=application/vnd.android.package-archive"

      # 步骤 9: 上传已签名的 App Bundle 到 Google Drive (自包含脚本)
      - name: Upload App Bundle to Google Drive
        run: |
          # --- 1. 获取凭据并生成 JWT (同上) ---
          CLIENT_EMAIL=$(echo "${{ secrets.GDRIVE_CREDENTIALS_DATA }}" | jq -r .client_email)
          PRIVATE_KEY=$(echo "${{ secrets.GDRIVE_CREDENTIALS_DATA }}" | jq -r .private_key)
          HEADER_B64=$(echo -n '{"alg":"RS256","typ":"JWT"}' | base64 | tr '/+' '_-' | tr -d '=')
          IAT=$(date +%s)
          EXP=$(($IAT + 3500))
          SCOPE="https://www.googleapis.com/auth/drive"
          PAYLOAD="{\"iss\":\"$CLIENT_EMAIL\",\"scope\":\"$SCOPE\",\"aud\":\"https://oauth2.googleapis.com/token\",\"exp\":$EXP,\"iat\":$IAT}"
          PAYLOAD_B64=$(echo -n "$PAYLOAD" | base64 | tr '/+' '_-' | tr -d '=')
          SIGNATURE_INPUT="$HEADER_B64.$PAYLOAD_B64"
          SIGNATURE=$(echo -n "$SIGNATURE_INPUT" | openssl dgst -sha256 -sign <(echo -n "$PRIVATE_KEY") | base64 | tr '/+' '_-' | tr -d '=')
          JWT="$SIGNATURE_INPUT.$SIGNATURE"

          # --- 2. 换取 Access Token (同上) ---
          TOKEN_RESPONSE=$(curl -s -X POST "https://oauth2.googleapis.com/token" -H "Content-Type: application/x-www-form-urlencoded" -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=$JWT")
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r .access_token)

          # --- 3. 上传文件 ---
          FILE_PATH="build/app/outputs/bundle/release/app-release.aab"
          FILE_NAME="app-release-bundle-${{ github.ref_name }}.aab"
          FOLDER_ID="${{ secrets.GDRIVE_FOLDER_ID }}"
          METADATA="{\"name\":\"$FILE_NAME\", \"parents\":[\"$FOLDER_ID\"]}"
          
          curl -s -X POST "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -F "metadata=$METADATA;type=application/json;charset=UTF-8" \
          -F "file=@$FILE_PATH;type=application/octet-stream"

      # 步骤 10: 创建 GitHub Release 并自动生成 Release Note
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
