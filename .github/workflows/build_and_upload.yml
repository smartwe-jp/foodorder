# .github/workflows/build_and_upload.yml

name: Build Signed App, Upload, and Create Release

# 触发器：当一个以 'v' 开头的 Git 标签被推送到仓库时触发
on:
  push:
    tags:
      - 'v*' # 匹配 v1.0, v1.2.3 等标签
  # 允许手动触发
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 虚拟机环境

    steps:
      # 步骤 1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤 2: 设置 Java 环境 (Flutter 打包 Android 需要)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # 步骤 3: 缓存 Flutter 依赖，加快后续构建速度
      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # 步骤 4: 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7' # 可以指定你项目使用的 Flutter 版本
          channel: 'stable'

      # 步骤 5: 获取 Flutter 依赖包
      - name: Get Flutter dependencies
        run: flutter pub get

      # 步骤 6: 解码并配置签名文件
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_JKS }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      # 步骤 7: 构建 Flutter APK 和 App Bundle
      - name: Build Flutter (APK & App Bundle)
        run: |
          flutter build apk --release
          flutter build appbundle --release

      # 步骤 8: 上传已签名的 APK 到 Google Drive (使用新的 Action)
      - name: Upload APK to Google Drive
        uses: Sanjay-B/gdrive-upload@v1.0.1
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          file-path: build/app/outputs/flutter-apk/app-release.apk # <-- 参数名是 'file-path'
          folder-id: ${{ secrets.GDRIVE_FOLDER_ID }}
          file-name: app-release-${{ github.ref_name }}.apk
          overwrite: 'true'

      # 步骤 9: 上传已签名的 App Bundle 到 Google Drive (使用新的 Action)
      - name: Upload App Bundle to Google Drive
        uses: Sanjay-B/gdrive-upload@v1.0.1
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          file-path: build/app/outputs/bundle/release/app-release.aab # <-- 参数名是 'file-path'
          folder-id: ${{ secrets.GDRIVE_FOLDER_ID }}
          file-name: app-release-bundle-${{ github.ref_name }}.aab
          overwrite: 'true'

      # 步骤 10: 创建 GitHub Release 并自动生成 Release Note
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
