name: Dispatch Android Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to run on'
        required: true
        default: 'android-release'
      tag:
        description: 'Optional tag input'
        required: false
        default: ''

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Android Workflow
        run: |
          DATA="{\"ref\":\"${{ github.event.inputs.ref }}\",\"inputs\":{\"tag\":\"${{ github.event.inputs.tag }}\"}}"
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.REPO_PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build_and_upload_android.yml/dispatches \
            -d "$DATA"