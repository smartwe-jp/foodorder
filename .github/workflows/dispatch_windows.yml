name: Dispatch Windows Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag containing build_and_upload_windows.yml (e.g. main)'
        required: true
        default: 'main'
      tag:
        description: 'Optional windows tag (e.g. w1.2.3)'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Windows build workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REF="${{ github.event.inputs.ref }}"
          TAG_INPUT="${{ github.event.inputs.tag }}"
          DATA=$(jq -n --arg r "$REF" --arg t "$TAG_INPUT" '{ref:$r, inputs:{tag:$t}}')
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build_and_upload_windows.yml/dispatches \
            -d "$DATA"
          echo "Dispatched build_and_upload_windows.yml on $REF (tag input: $TAG_INPUT)"