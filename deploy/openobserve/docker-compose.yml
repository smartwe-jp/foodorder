name: foodorder-observability

services:
  openobserve:
    image: ${OPENOBSERVE_IMAGE:-public.ecr.aws/zinclabs/openobserve:v0.90.3}
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:?Set OPENOBSERVE_ROOT_EMAIL in .env}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?Set OPENOBSERVE_ROOT_PASSWORD in .env}
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_WEB_URL: ${OPENOBSERVE_PUBLIC_URL:-http://localhost:5080}
      ZO_HEALTH_CHECK_ENABLED: "true"
      ZO_CORS_ALLOWED_ORIGINS: ${OPENOBSERVE_PUBLIC_URL:-http://localhost:5080}
    volumes:
      - openobserve-data:/data
    expose:
      - "5080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - openobserve
    environment:
      INGEST_KEY: ${OPENOBSERVE_INGEST_KEY:?Set OPENOBSERVE_INGEST_KEY in .env}
      OPENOBSERVE_BASIC_AUTH: ${OPENOBSERVE_BASIC_AUTH:?Set OPENOBSERVE_BASIC_AUTH in .env}
    ports:
      - "${OPENOBSERVE_BIND_ADDRESS:-127.0.0.1}:${OPENOBSERVE_HTTP_PORT:-5080}:8080"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openobserve-data:
    name: foodorder-openobserve-data
