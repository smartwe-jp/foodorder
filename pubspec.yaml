name: foodorder
version: 1.1.0+1
publish_to: none
description: A new Fanxing Food Order Flutter project.
environment: 
  sdk: '>=2.18.6 <3.0.0'

dependency_overrides:
  win32: 5.5.4


dependencies: 
  yaml: any
  sqflite_common_ffi: any
  cupertino_icons: ^1.0.5
  flutter_screenutil: ^5.9.0
  dio: ^5.8.0+1
  shared_preferences: ^2.0.15
  package_info_plus: 8.3.0
  fluttertoast: ^8.2.5
  sqflite: ^2.0.2
  cached_network_image: ^3.3.0
  event_bus: ^2.0.0
  flutter_easyloading: ^3.0.5
  permission_handler: ^12.0.1
  firebase_analytics: ^11.5.2
  firebase_core: ^3.15.1
  firebase_crashlytics: ^4.3.9
  open_file: ^3.2.1
  path_provider: ^2.0.11
  crypto: ^3.0.2
  assets_audio_player:
    git:
      url: git@github.com:Aaron51FX/Flutter-AssetsAudioPlayer.git
  widget_to_image:
    git:
      url: git@github.com:Aaron51FX/widget_to_image.git
  auto_size_text: ^3.0.0
  esc_pos_printer: ^4.1.0
  esc_pos_utils: ^1.1.0
  image: ^3.0.2
  get_storage: ^2.1.1
  flutter_swiper_plus: ^2.0.4
  google_fonts: ^6.2.1
  flutter_printer_plus:
    git:
      url: git@github.com:Aaron51FX/flutter_printer_plus.git
  badges: ^3.1.1
  audioplayers: ^5.2.1
  #win_toast: ^0.3.0
  adaptive_dialog: ^2.1.0
  logging: ^1.3.0
  connectivity_plus: ^6.1.4
  get: ^4.7.2
  intl: ^0.20.2
  archive: ^3.3.0
  transparent_image: ^2.0.1
  animated_widgets: ^1.1.0
  barcode_widget: ^2.0.4
  qr_flutter: ^4.0.0
  flutter_switch: ^0.3.2
  flutter_http_sse:
    git:
      url: git@github.com:Aaron51FX/flutter_http_sse.git
